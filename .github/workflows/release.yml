# Package releases, driven by conventional commits on main: a commit scoped to a package
# (`feat(sdk): …`) lands in that package's release pull request; merging it tags the release and
# publishes the package. Unscoped commits release nothing. See scripts/release/.
#
# Packages publish to Speechify's GitHub Packages registry with the workflow's GITHUB_TOKEN. bun packs
# the tarball (resolving `workspace:*` from bun.lock, which npm can't read) and npm uploads it.
name: release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - id: release
        run: bun scripts/release/main.ts
        env:
          # Pull requests opened with GITHUB_TOKEN trigger no workflows; set RELEASE_PLEASE_TOKEN
          # (a PAT or app token) to get CI on release pull requests.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@speechifyinc'
      - run: bun install --frozen-lockfile
      # Every package, in dependency order: a package's declarations resolve @speechifyinc/loqo-sdk from its dist.
      - run: bun run build:packages
      - name: Pack and publish
        working-directory: ${{ matrix.path }}
        run: |
          tarball="$(bun pm pack --quiet --destination "$RUNNER_TEMP")"
          npm publish "$RUNNER_TEMP/$(basename "$tarball")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
